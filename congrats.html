<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Congratulations 🎉</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial, sans-serif;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #ff758c,
                    #ff7eb3,
                    #c9184a
                );

        }


        /* Confetti */

        .confetti {

            position: fixed;

            top: -20px;

            width: 10px;

            height: 20px;

            animation:
                fall linear infinite;

            pointer-events: none;

        }


        @keyframes fall {

            0% {

                transform:
                    translateY(-30px)
                    rotate(0deg);

                opacity: 1;

            }


            100% {

                transform:
                    translateY(110vh)
                    rotate(720deg);

                opacity: 0;

            }

        }


        /* Main */

        .card {

            width: 90%;

            max-width: 600px;

            padding: 50px 30px;

            background:
                rgba(255,255,255,0.96);

            border-radius: 30px;

            text-align: center;

            box-shadow:
                0 25px 70px
                rgba(0,0,0,0.25);

            position: relative;

            z-index: 10;

            animation:
                popIn 0.8s ease;

        }


        @keyframes popIn {

            0% {

                transform:
                    scale(0.5);

                opacity: 0;

            }

            80% {

                transform:
                    scale(1.05);

            }

            100% {

                transform:
                    scale(1);

                opacity: 1;

            }

        }


        .celebrate {

            font-size: 80px;

            animation:
                bounce 1s infinite;

        }


        @keyframes bounce {

            0%,100% {
                transform:
                    translateY(0);
            }

            50% {
                transform:
                    translateY(-12px);
            }

        }


        .small {

            margin-top: 10px;

            color: #e91e63;

            font-weight: bold;

            letter-spacing: 3px;

            font-size: 14px;

        }


        h1 {

            margin-top: 12px;

            color: #333;

            font-size: 38px;

        }


        .message {

            margin-top: 15px;

            color: #777;

            font-size: 17px;

            line-height: 1.6;

        }


        /* Details */

        .details {

            margin-top: 30px;

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 15px;

        }


        .detail-box {

            padding: 22px 15px;

            background: #fff1f6;

            border-radius: 20px;

        }


        .detail-icon {

            font-size: 35px;

        }


        .detail-title {

            margin-top: 8px;

            color: #999;

            font-size: 13px;

        }


        .detail-value {

            margin-top: 7px;

            color: #e91e63;

            font-size: 19px;

            font-weight: bold;

        }


        .final-message {

            margin-top: 25px;

            color: #555;

            font-size: 18px;

            font-weight: bold;

        }


        .heart {

            margin-top: 20px;

            font-size: 35px;

        }


        @media(max-width:600px) {

            h1 {
                font-size: 30px;
            }

            .celebrate {
                font-size: 65px;
            }

            .details {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<!-- Confetti -->

<div class="confetti"
     style="left:5%; animation-duration:4s;">
     🎉
</div>

<div class="confetti"
     style="left:15%; animation-duration:5s;">
     💕
</div>

<div class="confetti"
     style="left:28%; animation-duration:3.5s;">
     🎊
</div>

<div class="confetti"
     style="left:42%; animation-duration:4.5s;">
     ❤️
</div>

<div class="confetti"
     style="left:55%; animation-duration:3s;">
     ✨
</div>

<div class="confetti"
     style="left:68%; animation-duration:5s;">
     🎉
</div>

<div class="confetti"
     style="left:80%; animation-duration:4s;">
     💖
</div>

<div class="confetti"
     style="left:92%; animation-duration:3.5s;">
     🎊
</div>



<div class="card">


    <div class="celebrate">
        🎉
    </div>


    <div class="small">
        IT'S A DATE!
    </div>


    <h1>
        Congratulations! ❤️
    </h1>


    <p class="message">

        The plan is officially made! 🥰

        <br>

        Here's what we picked:

    </p>



    <div class="details">


        <!-- Date -->

        <div class="detail-box">

            <div class="detail-icon">
                📅
            </div>

            <div class="detail-title">
                OUR DATE
            </div>

            <div
                class="detail-value"
                id="dateDisplay"
            >
                Loading...
            </div>

        </div>



        <!-- Food -->

        <div class="detail-box">

            <div class="detail-icon">
                🍽️
            </div>

            <div class="detail-title">
                FOOD
            </div>

            <div
                class="detail-value"
                id="foodDisplay"
            >
                Loading...
            </div>

        </div>


    </div>



    <div class="final-message">

        Good food + Good company = Perfect Day ✨

    </div>


    <div class="heart">
        ❤️ 💕 ❤️
    </div>


</div>



<script>


    // Get saved date and food

    const savedDate =
        localStorage.getItem("date");


    const savedFood =
        localStorage.getItem("food");



    // Format date nicely

    if (savedDate) {

        const date =
            new Date(
                savedDate + "T00:00:00"
            );


        const options = {

            weekday: "long",

            year: "numeric",

            month: "long",

            day: "numeric"

        };


        document.getElementById(
            "dateDisplay"
        ).innerText =
            date.toLocaleDateString(
                "en-US",
                options
            );

    }



    if (savedFood) {

        document.getElementById(
            "foodDisplay"
        ).innerText =
            savedFood;

    }


</script>


</body>

</html>
