<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Choose A Date 📅</title>


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial, sans-serif;

            padding: 20px;

            background:
                linear-gradient(
                    135deg,
                    #ffe0eb,
                    #ff9fba
                );

        }


        .date-card {

            width: 100%;

            max-width: 520px;

            background: white;

            padding: 45px 30px;

            border-radius: 30px;

            text-align: center;

            box-shadow:
                0 20px 60px rgba(0,0,0,0.18);

        }


        .icon {

            font-size: 65px;

        }


        .title {

            margin-top: 15px;

            color: #e91e63;

            font-size: 14px;

            letter-spacing: 3px;

            text-transform: uppercase;

            font-weight: bold;

        }


        h1 {

            margin-top: 12px;

            font-size: 32px;

            color: #333;

        }


        .subtitle {

            margin-top: 12px;

            color: #777;

            line-height: 1.6;

        }


        .date-box {

            margin-top: 30px;

            padding: 25px;

            background: #fff5f8;

            border-radius: 20px;

        }


        label {

            display: block;

            color: #555;

            font-weight: bold;

            margin-bottom: 12px;

        }


        input[type="date"] {

            width: 100%;

            padding: 15px;

            border: 2px solid #ffc1d4;

            border-radius: 15px;

            font-size: 17px;

            outline: none;

        }


        input[type="date"]:focus {

            border-color: #e91e63;

        }


        .continue-btn {

            margin-top: 25px;

            border: none;

            padding: 15px 35px;

            border-radius: 50px;

            background: #e91e63;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

        }


        .continue-btn:hover {

            transform: scale(1.05);

        }


        #error {

            margin-top: 15px;

            color: #e91e63;

            font-size: 14px;

        }


        @media(max-width:600px) {

            h1 {
                font-size: 27px;
            }

        }

    </style>

</head>


<body>


<div class="date-card">


    <div class="icon">
        📅
    </div>


    <div class="title">
        Step 1
    </div>


    <h1>
        Choose Our Date 🌸
    </h1>


    <p class="subtitle">

        Pick a day that works for you.
        <br>

        I'll save the date! ❤️

    </p>


    <div class="date-box">

        <label>
            Select Date
        </label>


        <input
            type="date"
            id="dateInput"
        >


        <button
            class="continue-btn"
            onclick="continueToFood()"
        >
            Continue 🍽️
        </button>


        <div id="error"></div>

    </div>


</div>



<script>

    const dateInput =
        document.getElementById("dateInput");


    // Get today's date

    const today =
        new Date();


    const year =
        today.getFullYear();


    const month =
        String(today.getMonth() + 1)
        .padStart(2, "0");


    const day =
        String(today.getDate())
        .padStart(2, "0");


    const todayString =
        `${year}-${month}-${day}`;


    // Don't allow past dates

    dateInput.min = todayString;



    function continueToFood() {

        const selectedDate =
            dateInput.value;


        const error =
            document.getElementById("error");


        if (selectedDate === "") {

            error.innerText =
                "Please select a date first ❤️";

            return;

        }


        // Save date

        localStorage.setItem(
            "date",
            selectedDate
        );


        // Go to food page

        window.location.href =
            "food.html";

    }

</script>


</body>

</html>
