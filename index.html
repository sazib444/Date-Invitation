<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Special Invitation ❤️</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            overflow: hidden;

            background:
                radial-gradient(circle at top left, #ffb3c6, transparent 40%),
                radial-gradient(circle at bottom right, #ff4d88, transparent 40%),
                linear-gradient(135deg, #ff758c, #ff416c);

            transition: opacity 0.5s;
        }

        /* Background hearts */

        .floating-heart {
            position: fixed;

            bottom: -50px;

            font-size: 25px;

            animation: floatUp linear infinite;

            opacity: 0.7;

            pointer-events: none;
        }

        .h1 {
            left: 10%;
            animation-duration: 7s;
        }

        .h2 {
            left: 25%;
            animation-duration: 9s;
            animation-delay: 2s;
        }

        .h3 {
            left: 50%;
            animation-duration: 8s;
            animation-delay: 1s;
        }

        .h4 {
            left: 75%;
            animation-duration: 10s;
            animation-delay: 3s;
        }

        .h5 {
            left: 90%;
            animation-duration: 7s;
            animation-delay: 4s;
        }

        @keyframes floatUp {

            0% {
                transform: translateY(0) rotate(0deg);
            }

            100% {
                transform: translateY(-110vh) rotate(360deg);
            }

        }


        /* Main Card */

        .card {

            width: 90%;
            max-width: 550px;

            padding: 50px 30px;

            text-align: center;

            background: rgba(255,255,255,0.94);

            border-radius: 30px;

            box-shadow:
                0 25px 70px rgba(0,0,0,0.25);

            position: relative;

            z-index: 10;

        }


        /* Heart */

        .heart {

            font-size: 85px;

            display: inline-block;

            animation: heartbeat 1.2s infinite;

        }

        @keyframes heartbeat {

            0%,100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }

        }


        .small-title {

            margin-top: 15px;

            color: #e91e63;

            font-size: 14px;

            font-weight: bold;

            letter-spacing: 4px;

            text-transform: uppercase;

        }


        h1 {

            margin-top: 15px;

            color: #333;

            font-size: 36px;

            line-height: 1.3;

        }


        .description {

            margin-top: 18px;

            color: #777;

            font-size: 17px;

            line-height: 1.7;

        }


        /* Buttons */

        .button-area {

            margin-top: 35px;

            height: 70px;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 20px;

        }


        button {

            border: none;

            padding: 15px 32px;

            border-radius: 50px;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

        }


        #yesBtn {

            background: #e91e63;

            color: white;

            box-shadow:
                0 8px 25px rgba(233,30,99,0.35);

            transition: 0.3s;

        }


        #yesBtn:hover {

            transform: scale(1.1);

        }


        #noBtn {

            background: #eeeeee;

            color: #555;

            position: relative;

            z-index: 100;

        }


        .bottom-text {

            margin-top: 20px;

            color: #aaa;

            font-size: 13px;

        }


        @media(max-width:600px) {

            .card {
                padding: 40px 20px;
            }

            h1 {
                font-size: 29px;
            }

            .heart {
                font-size: 70px;
            }

        }

    </style>

</head>


<body>


    <!-- Floating hearts -->

    <div class="floating-heart h1">❤️</div>
    <div class="floating-heart h2">💕</div>
    <div class="floating-heart h3">💗</div>
    <div class="floating-heart h4">💖</div>
    <div class="floating-heart h5">❤️</div>


    <!-- Invitation -->

    <div class="card">

        <div class="heart">
            ❤️
        </div>


        <div class="small-title">
            A Special Invitation
        </div>


        <h1>
            Would You Like To<br>
            Go On A Date? 🌸
        </h1>


        <p class="description">

            A little time together,
            <br>

            some delicious food,
            <br>

            and a day to remember. ✨

        </p>


        <div class="button-area">

            <button id="yesBtn" onclick="yesClicked()">
                Yes ❤️
            </button>


            <button id="noBtn">
                No 😭
            </button>

        </div>


        <div class="bottom-text">
            Choose your answer 😊
        </div>

    </div>



<script>

    const noBtn = document.getElementById("noBtn");


    // Move the NO button
    function moveNoButton() {

        const buttonWidth = noBtn.offsetWidth;
        const buttonHeight = noBtn.offsetHeight;

        const padding = 20;


        const maxX =
            window.innerWidth -
            buttonWidth -
            padding;


        const maxY =
            window.innerHeight -
            buttonHeight -
            padding;


        const randomX =
            Math.max(
                padding,
                Math.random() * maxX
            );


        const randomY =
            Math.max(
                padding,
                Math.random() * maxY
            );


        noBtn.style.position = "fixed";

        noBtn.style.left = randomX + "px";

        noBtn.style.top = randomY + "px";

    }


    // Desktop
    noBtn.addEventListener(
        "mouseenter",
        moveNoButton
    );


    // Mobile
    noBtn.addEventListener(
        "touchstart",
        function(event) {

            event.preventDefault();

            moveNoButton();

        }
    );


    // YES
    function yesClicked() {

        document.body.style.opacity = "0";

        setTimeout(function() {

            window.location.href = "date.html";

        }, 500);

    }

</script>


</body>

</html>
